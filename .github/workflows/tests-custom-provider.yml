name: Tests (custom provider)

# The *-custom-provider examples need no cloud credentials and no Docker, so
# they run on every pull request, forks included.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-custom-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript custom provider
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript-custom-provider
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: typescript-custom-provider/package-lock.json
      - run: npm ci
      - run: npx tsc -p .
      - run: npm test

  python:
    name: Python custom provider
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python-custom-provider
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: python-custom-provider/uv.lock
      - run: uv run --locked pytest

  dotnet:
    name: .NET custom provider
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test dotnet-custom-provider
